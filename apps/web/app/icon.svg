<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- Иконка вкладки браузера — знак SNR EduOS: три треугольника «вертушкой».
       07.08.2026 — раньше здесь был жёлто-оранжевый квадрат с буквой S, никак
       не связанный с логотипом. Тот же знак стоит внутри буквы «O» в
       /public/logos/snr-eduos.png и в родительском приложении
       (apps/mobile-parent/assets/logo-mark.png) — цвета взяты оттуда.

       Треугольник задан один раз и трижды повёрнут на 120° вокруг центра: так
       вертушка симметрична, а править форму нужно в одном месте. Основания
       смотрят к центру, вершины наружу; просвет между треугольниками оставлен
       намеренно — без него на 16px знак сливается в одно пятно. stroke того же
       цвета с linejoin=round скругляет углы, на мелком размере только это и
       отличает знак от трёх острых клиньев. Фон прозрачный: цвета яркие и
       читаются и на светлой, и на тёмной вкладке.

       ВАЖНО: комментарий должен быть ВНУТРИ <svg>, а не перед ним — иначе
       next-metadata-image-loader не распознаёт файл как изображение и сборка
       падает с «is not a valid image file». -->
  <g stroke-linejoin="round" stroke-width="2.4">
    <path d="M29.6 16 L20.8 11.5 L20.8 20.5 Z"
          fill="#FBBF24" stroke="#FBBF24" transform="rotate(-30 16 16)"/>
    <path d="M29.6 16 L20.8 11.5 L20.8 20.5 Z"
          fill="#EC4899" stroke="#EC4899" transform="rotate(90 16 16)"/>
    <path d="M29.6 16 L20.8 11.5 L20.8 20.5 Z"
          fill="#22D3EE" stroke="#22D3EE" transform="rotate(210 16 16)"/>
  </g>
</svg>
